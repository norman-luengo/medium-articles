[project]
name = "medium_articles"
version = "0.0.1"
description = "This is a repository to code and experiment about different topics in order to create medium articles to share with the community."
authors = [
    {name = "norman-luengo",email = "luengo.norman@gmail.com"}
]
# license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.13,<4.0"

[tool.poetry.group.mlflow_article.dependencies]
mlflow = "3.1.4"
fastapi = "0.116.1"
pydantic-ai = "0.4.7"
ollama = "0.5.1"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
